name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Two jobs, as in GitHub's starter workflow. With upload and deploy in one job,
# deploy-pages intermittently cannot see the artifact uploaded seconds earlier
# ("No artifacts named github-pages", actions/deploy-pages#451, 2026-11-23).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Only the public edition is ever published: index.html, pitch.html and assets/,
      # scanned for internal terms (the build fails on any hit). docs/, tests/ and
      # scripts/ stay in the repository and are no longer served.
      - name: Build the public edition
        run: node scripts/build.js public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
